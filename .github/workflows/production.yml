name: Balearn frontend CI/CD

on:
  pull_request:
    branches: [develop-2026]
  push:
    branches: [develop-2026]

permissions:
  contents: read

concurrency:
  group: balearn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BALEARN_PUBLIC_URL: ${{ vars.BALEARN_PUBLIC_URL || 'https://hmwg.balearn.o-r.kr:9443' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies and check lint
        run: |
          docker run --rm -v "$PWD:/app" -w /app node:22-bookworm-slim \
            sh -ec 'npm ci && npm run lint'
      - name: Build and check production image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$BALEARN_PUBLIC_URL" \
            --build-arg NEXT_PUBLIC_LOGIN_PROVIDERS=kakao \
            --build-arg DIRECT_MEDIA_IMAGES=1 \
            -t "balearn-frontend:$GITHUB_SHA" .
          docker run --rm --entrypoint node "balearn-frontend:$GITHUB_SHA" \
            -e 'const html = require("node:fs").readFileSync(".next/server/app/index.html", "utf8"); if (!html.includes("카카오 로그인") || html.includes("조직 계정으로 로그인")) process.exit(1);'

      - name: Save verified image
        if: github.event_name == 'push'
        run: docker save "balearn-frontend:$GITHUB_SHA" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: production-image
          path: image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop-2026'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-image
      - name: Publish tested image for the VM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="production-$GITHUB_SHA"
          if gh release view "$tag" --json isDraft,assets --jq '.isDraft == false and any(.assets[]; .name == "image.tar.gz")' | grep -qx true; then
            exit 0
          fi
          gh release create "$tag" image.tar.gz --target "$GITHUB_SHA" --latest=false \
            --title "Balearn frontend ${GITHUB_SHA:0:12}" --notes "Image verified by GitHub Actions for develop-2026."
